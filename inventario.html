<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario · MiPyme Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet">
</head>
<body data-pagina="inventario">

<header class="app-header">
  <a href="index.html" class="app-header-back" aria-label="Volver al inicio"><i class="bi bi-chevron-left"></i></a>
  <div class="app-header-icon bg-info-subtle text-info-emphasis"><i class="bi bi-box-seam"></i></div>
  <div class="app-header-text">
    <h1 class="app-header-title">Inventario</h1>
    <p class="app-header-subtitle">Compras y ventas mueven el stock automáticamente</p>
  </div>
</header>

<main class="container py-3 fade-in-up">
  <button class="btn btn-info btn-lg w-100 mb-3" data-bs-toggle="modal" data-bs-target="#modalProducto"><i class="bi bi-plus-lg"></i> Nuevo producto</button>

  <table class="table table-cards">
    <thead><tr><th>Producto</th><th class="text-end">Stock</th><th class="text-end">Costo</th><th class="text-end">Precio venta</th><th>Vence</th><th>Alertas</th></tr></thead>
    <tbody id="tablaProductos"></tbody>
  </table>
</main>

<div class="modal fade" id="modalProducto" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="formProducto" class="needs-validation" novalidate>
        <div class="modal-header">
          <h5 class="modal-title fw-brand">Nuevo producto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label">Nombre</label>
            <input class="form-control" name="nombre" required>
          </div>
          <div class="row g-2">
            <div class="col-6">
              <label class="form-label">Unidad</label>
              <input class="form-control" name="unidad" placeholder="unidad, kg, caja..." value="unidad" required>
            </div>
            <div class="col-6">
              <label class="form-label">Stock inicial</label>
              <input type="number" class="form-control" name="stock" min="0" step="0.001" value="0" required>
            </div>
          </div>
          <div class="row g-2 mt-1">
            <div class="col-6">
              <label class="form-label">Stock mínimo (alerta)</label>
              <input type="number" class="form-control" name="stockMinimo" min="0" step="0.001" value="0" required>
            </div>
            <div class="col-6">
              <label class="form-label">Vence (opcional)</label>
              <input type="date" class="form-control" name="fechaVencimiento">
            </div>
          </div>
          <div class="row g-2 mt-1">
            <div class="col-6">
              <label class="form-label">Costo unitario</label>
              <input type="number" class="form-control" name="costoUnitario" min="0" step="0.01" value="0" required>
            </div>
            <div class="col-6">
              <label class="form-label">Precio de venta</label>
              <input type="number" class="form-control" name="precioVenta" min="0" step="0.01" value="0" required>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-info">Guardar producto</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/utils.js"></script>
<script src="js/ui.js"></script>
<script src="js/inventario.js"></script>
</body>
</html>
