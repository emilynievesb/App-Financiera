<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gastos · MiPyme Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet">
</head>
<body data-pagina="gastos">

<header class="app-header">
  <a href="index.html" class="app-header-back" aria-label="Volver al inicio"><i class="bi bi-chevron-left"></i></a>
  <div class="app-header-icon bg-danger-subtle text-danger"><i class="bi bi-receipt"></i></div>
  <div class="app-header-text">
    <h1 class="app-header-title">Gastos</h1>
    <p class="app-header-subtitle">Gastos operativos del negocio</p>
  </div>
</header>

<main class="container py-3 fade-in-up">

  <ul class="nav nav-tabs" id="tabs" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-registrar" type="button">Registrar</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-pagos" type="button">Pagos</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-historial" type="button">Historial</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-resumen" type="button">Resumen</button></li>
  </ul>

  <div class="tab-content">

    <div class="tab-pane fade show active" id="tab-registrar">
      <p class="text-secondary-app">Renta, servicios, salarios y otros gastos que no se venden.</p>
      <button class="btn btn-danger btn-lg w-100" data-bs-toggle="modal" data-bs-target="#modalGasto"><i class="bi bi-plus-lg"></i> Registrar gasto</button>
    </div>

    <div class="tab-pane fade" id="tab-pagos">
      <h2 class="h6 fw-brand">Gastos a crédito pendientes de pago</h2>
      <table class="table table-cards">
        <thead><tr><th>Concepto</th><th>Fecha</th><th class="text-end">Debemos</th></tr></thead>
        <tbody id="tablaPendientes"></tbody>
      </table>

      <h2 class="h6 fw-brand mt-4">Registrar pago</h2>
      <form id="formPago" class="row g-2 needs-validation card-surface p-3 mx-0" novalidate>
        <div class="col-12 col-md-4">
          <label class="form-label">Gasto</label>
          <select class="form-select" name="gastoId" required></select>
          <div class="invalid-feedback">Elige un gasto pendiente.</div>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label">Fecha</label>
          <input type="date" class="form-control" name="fecha" required>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label">Monto</label>
          <input type="number" min="0.01" step="0.01" class="form-control" name="monto" required>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label">Método</label>
          <select class="form-select" name="metodoPago" required>
            <option value="efectivo">Efectivo</option>
            <option value="transferencia">Transferencia</option>
            <option value="tarjeta">Tarjeta</option>
          </select>
        </div>
        <div class="col-6 col-md-1 d-flex align-items-end">
          <button class="btn btn-danger w-100">Pagar</button>
        </div>
      </form>
    </div>

    <div class="tab-pane fade" id="tab-historial">
      <div class="row g-2 mb-3">
        <div class="col-6 col-md-3"><input type="date" id="histDesde" class="form-control form-control-sm"></div>
        <div class="col-6 col-md-3"><input type="date" id="histHasta" class="form-control form-control-sm"></div>
        <div class="col-md-3"><button id="btnFiltrarHist" class="btn btn-sm btn-outline-primary">Filtrar</button></div>
      </div>
      <table class="table table-cards">
        <thead><tr><th>Concepto</th><th>Fecha</th><th class="text-end">Monto</th><th>Método</th></tr></thead>
        <tbody id="tablaHistorial"></tbody>
      </table>
    </div>

    <div class="tab-pane fade" id="tab-resumen">
      <div class="btn-group mb-3" role="group">
        <button class="btn btn-outline-primary" data-periodo="dia">Día</button>
        <button class="btn btn-outline-primary" data-periodo="semana">Semana</button>
        <button class="btn btn-outline-primary" data-periodo="mes">Mes</button>
      </div>
      <input type="date" id="resumenFecha" class="form-control form-control-sm d-inline-block w-auto mb-3 ms-2">
      <table class="table card-surface p-2">
        <tbody id="tablaResumen"></tbody>
      </table>
    </div>

  </div>
</main>

<div class="modal fade" id="modalGasto" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="formGasto" class="needs-validation" novalidate>
        <div class="modal-header">
          <h5 class="modal-title fw-brand">Registrar gasto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <button type="button" id="btnVoz" class="btn btn-outline-danger btn-voz btn-sm"><i class="bi bi-mic-fill"></i> Dictar monto y método</button>
            <div id="estadoVoz" class="voice-status"></div>
          </div>
          <div class="mb-2">
            <label class="form-label">Fecha</label>
            <input type="date" name="fecha" class="form-control" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Concepto</label>
            <input class="form-control" name="concepto" required placeholder="Ej: Arriendo, servicios, transporte">
            <div class="invalid-feedback">Describe el gasto.</div>
          </div>
          <div class="mb-2">
            <label class="form-label">Monto</label>
            <input type="number" name="monto" min="0.01" step="0.01" class="form-control" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Método de pago</label>
            <select name="metodoPago" class="form-select" required>
              <option value="efectivo">Efectivo</option>
              <option value="credito">Crédito</option>
              <option value="transferencia">Transferencia</option>
              <option value="tarjeta">Tarjeta</option>
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label">Notas</label>
            <input class="form-control" name="notas">
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-danger">Guardar gasto</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/utils.js"></script>
<script src="js/voice.js"></script>
<script src="js/ui.js"></script>
<script src="js/gastos.js"></script>
</body>
</html>
